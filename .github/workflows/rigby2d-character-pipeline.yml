name: Rigby2D Character Pipeline
on:
  push:
    branches: [feature/rigby2d-character-pipeline]
    paths:
      - 'rigby2d_pipeline.py'
      - 'assets/rigby2d/hero/**'
      - 'docs/RIGBY2D_PIPELINE.md'
      - '.github/workflows/rigby2d-character-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-character:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check for authored Rigby2D exports
        id: preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root=Path('assets/rigby2d/hero')
          names=['front_intro','turn_threequarter','turn_profile','walk','stop_momentum','look_back','run','jump','land','front_expression']
          missing=[]
          if not (root/'manifest.json').exists(): missing.append('manifest.json')
          for name in names:
              files=list((root/name).glob('*.png')) if (root/name).exists() else []
              if len(files)<8: missing.append(f'{name}: {len(files)} PNG frames (need 8+)')
          ready=not missing
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'ready={str(ready).lower()}\\n')
          if not ready:
              print('WAITING FOR RIGBY2D AUTHORING EXPORTS:')
              print('\\n'.join(missing))
              print('See docs/RIGBY2D_PIPELINE.md. No synthetic stick-figure substitute will be rendered.')
          else: print('All Rigby2D action exports are present.')
          PY
      - name: Install FFmpeg and Pillow
        if: steps.preflight.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install Pillow
      - name: Validate adapter
        if: steps.preflight.outputs.ready == 'true'
        run: python -m py_compile rigby2d_pipeline.py
      - name: Render Rigby2D character action reel
        if: steps.preflight.outputs.ready == 'true'
        run: python rigby2d_pipeline.py --output output/rigby2d-character-test.mp4
      - name: Validate MP4 properties
        if: steps.preflight.outputs.ready == 'true'
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of json output/rigby2d-character-test.mp4 > output/probe.json
          python - <<'PY'
          import json
          p=json.load(open('output/probe.json'))
          s=p['streams'][0]
          assert (s['width'],s['height'])==(1280,720), s
          assert s['r_frame_rate']=='30/1', s
          assert float(p['format']['duration']) >= 12.0, p
          print('PASS: 1280x720, 30 FPS, 12+ seconds')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          name: rigby2d-character-action-reel
          path: |
            output/rigby2d-character-test.mp4
            output/rigby2d-report.json
          if-no-files-found: error
          retention-days: 14
